name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Bash syntax
        run: bash -n scripts/*.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Verify repository standard files
        run: |
          test -s .github/CODEOWNERS
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/ISSUE_TEMPLATE/feature.yml
          test -s CONTRIBUTING.md
          test -s docs/repository-standard.md
